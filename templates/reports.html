{% extends "admin_layout.html" %}

{% block title %}
Student Reports
{% endblock %}

{% block content %}

<style>

.page{

    padding:30px;

}

.report-card{

    background:white;

    border-radius:15px;

    padding:30px;

    box-shadow:0 10px 20px rgba(0,0,0,.08);

}

.report-card h2{

    color:#1565c0;

    margin-bottom:10px;

}

.report-card p{

    color:#666;

    margin-bottom:30px;

}

.form-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:20px;

}

.form-group{

    display:flex;

    flex-direction:column;

}

label{

    font-weight:bold;

    margin-bottom:8px;

}

.form-control{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

}

.full{

    grid-column:1 / -1;

}

.btn{

    background:#1565c0;

    color:white;

    border:none;

    padding:14px 25px;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;

}

.btn:hover{

    background:#0d47a1;

}

@media(max-width:900px){

.form-grid{

grid-template-columns:1fr;

}

.full{

grid-column:auto;

}

}

</style>

<div class="page">

    <div class="report-card">

        <h2>

            📄 Student Reports

        </h2>

        <p>

            Select the Academic Session, Term and Student you want to view.

        </p>

        <form id="reportForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Academic Session

                    </label>

                    <select
                        id="session"
                        class="form-control"
                    >

                        {% for session in sessions %}

                        <option value="{{ session }}">

                            {{ session }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Term

                    </label>

                    <select
                        id="term"
                        class="form-control"
                    >

                        <option value="First Term">

                            First Term

                        </option>

                        <option value="Second Term">

                            Second Term

                        </option>

                        <option value="Third Term">

                            Third Term

                        </option>

                    </select>

                </div>

                <div class="form-group full">

                    <label>

                        Student

                    </label>

                    <select
                        id="student"
                        class="form-control"
                    >

                        {% for student in students %}

                        <option value="{{ student.student_id }}">

                            {{ student.full_name }}

                            ({{ student.class }})

                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <br>

            <button
                type="button"
                class="btn"
                onclick="openReport()">

                📄 View Report

            </button>

        </form>

    </div>

</div>
<!-- =====================================================
PHASE 13
RESULT ANALYTICS
===================================================== -->

<div class="dashboard-card">

    <div class="card-header">

        <h2>

            📊 Result Analytics

        </h2>

    </div>

    <div style="display:flex;flex-wrap:wrap;gap:30px;justify-content:center;">

        <div style="width:450px;">

            <canvas id="gradeChart"></canvas>

        </div>

        <div style="width:450px;">

            <canvas id="passFailChart"></canvas>

        </div>

    </div>

</div>

<script>

function openReport() {

    const student = document.getElementById("student").value;

    const session = document.getElementById("session").options[
        document.getElementById("session").selectedIndex
    ].value;

    const term = document.getElementById("term").options[
        document.getElementById("term").selectedIndex
    ].value;

    console.log("Student:", student);
    console.log("Session:", session);
    console.log("Term:", term);

    window.location =
        "/student_report/" +
        student +
        "?session=" +
        encodeURIComponent(session) +
        "&term=" +
        encodeURIComponent(term);
}
</script>

{% endblock %}
