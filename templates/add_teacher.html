
{% extends "admin_layout.html" %}

{% block title %}
Add Teacher
{% endblock %}

{% block content %}

<style>

.page-header{
    margin-bottom:30px;
}

.page-header h1{
    color:#0b3d91;
    font-size:32px;
}

.form-container{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    max-width:800px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:600;
    margin-bottom:8px;
    color:#333;
}

.form-control{
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.form-control:focus{
    outline:none;
    border-color:#1565c0;
}

.btn-submit{
    background:#1565c0;
    color:white;
    border:none;
    padding:14px 25px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    margin-top:20px;
}

.btn-submit:hover{
    background:#0b3d91;
}

@media(max-width:768px){

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

<div class="page-header">
    <h1>Add Teacher</h1>
    <p>Create teacher accounts and assign classes.</p>
</div>

<div class="form-container">

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Teacher ID</label>
                <input type="text"
                       name="teacher_id"
                       class="form-control"
                       required>
            </div>

            <div class="form-group">
                <label>Full Name</label>
<input type="text"
       name="teacher_name"
       class="form-control"
       required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
<input type="email"
       name="teacher_email"
       class="form-control"
       required>
            </div>

            <div class="form-group">
                <label>Password</label>
<input type="password"
       name="teacher_password"
       class="form-control"
       required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text"
                       name="phone"
                       class="form-control">
            </div>

            <div class="form-group">
                <label>Assigned Class</label>

                <select name="teacher_class"
                        class="form-control"
                        required>

                    <option value="">Select Class</option>

                    <option>JSS1</option>
                    <option>JSS2</option>
                    <option>JSS3</option>

                    <option>SS1</option>
                    <option>SS2</option>
                    <option>SS3</option>

                </select>

            </div>

        </div>

        <button type="submit" class="btn-submit">
            Add Teacher
        </button>

    </form>

</div>

{% endblock %}
